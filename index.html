<!-- Fuse.js 검색 -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
let fuseIndex = null;
let fuse = null;

async function loadIndex() {
  if (fuseIndex) return;
  const resp = await fetch('/search_index.json');
  fuseIndex = await resp.json();
  fuse = new Fuse(fuseIndex, {
    keys: ['rcrfrstNm', 'doShort', 'sigungu', 'rdnmadr', 'rcrfrstType'],
    threshold: 0.35,
    minMatchCharLength: 1,
  });
  updateCounts();
  renderStay();
}

function updateCounts() {
  if (!fuseIndex) return;
  const types = ['국유림', '공유림', '사유림'];
  types.forEach(t => {
    const cnt = fuseIndex.filter(f => f.rcrfrstType === t).length;
    const el = document.getElementById('cnt-' + t);
    if (el) el.textContent = cnt + '개';
  });
}

function renderStay() {
  if (!fuseIndex) return;
  const stay = fuseIndex.filter(f => f.stayngPosblYn === 'Y').slice(0, 12);
  document.getElementById('stayForests').innerHTML = stay.map(forestCard).join('');
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { document.getElementById('search-results').innerHTML = ''; return; }
  loadIndex().then(() => {
    const results = fuse ? fuse.search(q).slice(0, 20) : [];
    const el = document.getElementById('search-results');
    if (results.length === 0) {
      el.innerHTML = '<p style="text-align:center;padding:20px;color:#6B7280;">검색 결과가 없습니다.</p>';
      return;
    }
    el.innerHTML = `<div style="max-width:960px;margin:0 auto;padding:0 20px;">
      <p style="padding:8px 0;font-size:.9rem;color:#6B7280;">"${q}" 검색 결과 ${results.length}개</p>
      ${results.map(r => searchResultItem(r.item)).join('')}
    </div>`;
    el.scrollIntoView({ behavior: 'smooth' });
  });
}

function forestCard(f) {
  return `<a class="camp-card" href="/forest/${f.slug}/">
    <div class="camp-card-img-placeholder">🌲</div>
    <div class="camp-card-body">
      <div class="camp-card-name">${f.rcrfrstNm}</div>
      <div class="camp-card-loc">📍 ${f.sigungu || f.doShort || ''}</div>
      <div class="camp-card-tags">
        ${f.rcrfrstType ? `<span class="tag tag-type">${f.rcrfrstType}</span>` : ''}
        ${f.stayngPosblYn === 'Y' ? `<span class="tag tag-pet">🏠 숙박</span>` : ''}
      </div>
    </div>
  </a>`;
}

function searchResultItem(f) {
  return `<div class="search-result-item">
    <a href="/forest/${f.slug}/">
      <div class="search-result-thumb" style="background:#d1fae5;display:flex;align-items:center;justify-content:center;font-size:1.5rem;border-radius:6px;">🌲</div>
      <div>
        <div class="search-result-name">${f.rcrfrstNm}</div>
        <div class="search-result-loc">📍 ${f.doShort || ''} ${f.sigungu || ''}</div>
        ${f.rcrfrstType ? `<span class="search-result-tag">${f.rcrfrstType}</span>` : ''}
      </div>
    </a>
  </div>`;
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

loadIndex();
</script>
